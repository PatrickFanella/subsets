name: Deploy
run-name: Deploy ${{ github.sha }}

# Deploys the main landing page to Almaz. The job joins the tailnet as
# tag:github-ci (Tailscale OAuth client in the TS_OAUTH_* secrets), then uses
# this repository's deploy key, which Almaz accepts only from tailnet addresses
# and only for the Subsets landing receiver.
'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a run that may be mid-deployment.
  cancel-in-progress: false

env:
  TARGET: onnwee@100.77.128.80
  REVISION: ${{ github.sha }}

jobs:
  deploy:
    name: Landing image and main deployment
    if: github.repository == 'subculture-collective/subsets' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - name: Join the tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-ci
          version: 1.104.7
          # The tailnet resolver is a LAN address this runner cannot reach;
          # keep the runner's own DNS so image and package pulls resolve.
          args: --accept-dns=false
      - name: Prepare the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.ALMAZ_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ALMAZ_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy/known_hosts"
      - name: Build and check the landing image
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"
          image="subsets-landing-main:$REVISION"
          docker build -f deploy/Dockerfile -t "$image" \
            --label "tv.subcult.source-revision=$REVISION" \
            --label "tv.subcult.deployment.channel=main" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/subsets" .
          bash deploy/check-landing-image.sh "$image"
      - name: Deploy verified main through the existing landing receiver
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/deploy"
          almaz=(ssh -F /dev/null -o ControlPath=none -o ControlMaster=no
            -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts"
            -o ConnectTimeout=15 "$TARGET")
          image="subsets-landing-main:$REVISION"
          "${almaz[@]}" status
          # The receiver deploys only Gitea's current main. Kvant copies GitHub
          # to Gitea every minute, so wait while the revision has not arrived.
          for attempt in $(seq 1 20); do
            # shellcheck disable=SC2029
            if docker save "$image" | "${almaz[@]}" "receive-main $REVISION" 2> "$d/err"; then break; fi
            if grep -q "is not current main" "$d/err" && [ "$attempt" -lt 20 ]; then
              echo "Gitea has not received $REVISION yet; waiting 30 s ($attempt/20)"; sleep 30; continue
            fi
            cat "$d/err" >&2; exit 1
          done
          # shellcheck disable=SC2029
          "${almaz[@]}" "deploy-main $REVISION"
          expected=$(docker run --rm --network none --read-only --entrypoint cat "$image" /usr/share/nginx/html/index.html | sha256sum | cut -d' ' -f1)
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            --max-time 30 https://subsets.subcult.tv/ > "$d/live.html"
          actual=$(sha256sum "$d/live.html" | cut -d' ' -f1)
          test "$actual" = "$expected"
          printf 'Public landing HTML matches source %s\n' "$REVISION"
      - name: Remove the deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy"
