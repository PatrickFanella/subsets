name: CI
'on':
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      # LFS objects are pulled in the next step. During checkout the action sends the
      # job token as an extra header, git-lfs adds the batch reply's Authorization
      # header, and Cloudflare answers the doubled header with 400.
      with:
        persist-credentials: false
    - name: Fetch LFS objects
      # Anonymous, so each download carries one Authorization header. Public repository.
      shell: bash
      run: git lfs install --local && git lfs pull
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install locked Node dependencies
      shell: bash
      run: npm ci
    - name: Run Node checks
      shell: bash
      run: |-
        npm test
        npm run typecheck
        npm run format:check
  python:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      # LFS objects are pulled in the next step. During checkout the action sends the
      # job token as an extra header, git-lfs adds the batch reply's Authorization
      # header, and Cloudflare answers the doubled header with 400.
      with:
        persist-credentials: false
    - name: Fetch LFS objects
      # Anonymous, so each download carries one Authorization header. Public repository.
      shell: bash
      run: git lfs install --local && git lfs pull
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
      env:
        AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/python-tools-${{ github.run_id }}-${{ github.run_attempt }}-${{
          github.job }}
        RUNNER_TOOL_CACHE: ${{ runner.temp }}/python-tools-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job
          }}
    - name: Install uv and locked Python dependencies
      shell: bash
      run: |-
        python3 -m pip install uv==0.13.6
        uv sync --python "$(command -v python3)" --frozen --extra test
    - name: Run Python tests
      shell: bash
      run: uv run --frozen --extra test python -m pytest
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
    - node
    - python
    steps:
    - name: Require every quality job to succeed
      shell: bash
      run: |-
        test "$NODE_RESULT" = success
        test "$PYTHON_RESULT" = success
      env:
        NODE_RESULT: ${{ needs.node.result }}
        PYTHON_RESULT: ${{ needs.python.result }}

  landing:
    name: Landing image and main deployment
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVISION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Fetch landing LFS assets
      run: git lfs install --local && git lfs pull
    - name: Build and check the landing image
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$REVISION"
        image="subsets-landing-main:$REVISION"
        docker build -f deploy/Dockerfile -t "$image" \
          --label "tv.subcult.source-revision=$REVISION" \
          --label "tv.subcult.deployment.channel=main" \
          --label "org.opencontainers.image.revision=$REVISION" \
          --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/subsets" .
        bash deploy/check-landing-image.sh "$image"
    - name: Deploy verified main through the existing landing receiver
      if: >-
        github.server_url == 'https://git.subcult.tv' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      shell: bash
      env:
        ALMAZ_DEPLOY_KEY_B64: ${{ secrets.ALMAZ_DEPLOY_KEY_B64 }}
        ALMAZ_KNOWN_HOSTS: ${{ secrets.ALMAZ_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        test -n "$ALMAZ_DEPLOY_KEY_B64"
        test -n "$ALMAZ_KNOWN_HOSTS"
        umask 077
        deploy_dir=$(mktemp -d)
        trap 'rm -rf "$deploy_dir"' EXIT
        printf '%s' "$ALMAZ_DEPLOY_KEY_B64" | base64 -d > "$deploy_dir/key"
        printf '%s\n' "$ALMAZ_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
        unset ALMAZ_DEPLOY_KEY_B64 ALMAZ_KNOWN_HOSTS
        almaz=(ssh -F /dev/null -o ControlPath=none -o ControlMaster=no
          -i "$deploy_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
          -o ConnectTimeout=15 onnwee@10.0.0.200)
        image="subsets-landing-main:$REVISION"
        "${almaz[@]}" status
        # shellcheck disable=SC2029
        docker save "$image" | "${almaz[@]}" "receive-main $REVISION"
        # shellcheck disable=SC2029
        "${almaz[@]}" "deploy-main $REVISION"
        expected=$(docker run --rm --network none --read-only --entrypoint cat "$image" /usr/share/nginx/html/index.html | sha256sum | cut -d' ' -f1)
        curl --fail --silent --show-error --retry 4 --retry-all-errors \
          --max-time 30 https://subsets.subcult.tv/ > "$deploy_dir/live.html"
        actual=$(sha256sum "$deploy_dir/live.html" | cut -d' ' -f1)
        test "$actual" = "$expected"
        printf 'Public landing HTML matches source %s\n' "$REVISION"
