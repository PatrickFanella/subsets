name: Mirror CI
run-name: Mirror CI ${{ github.sha }}
'on':
  push:
    # main is verified and deployed by Gitea after merge.
    branches-ignore:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    name: Node quality
    if: github.repository == 'subculture-collective/subsets'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        lfs: true
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install locked Node dependencies
      shell: bash
      run: npm ci
    - name: Run Node checks
      shell: bash
      run: |-
        set -euo pipefail
        npm test
        npm run typecheck
        npm run format:check
  python:
    name: Python quality
    if: github.repository == 'subculture-collective/subsets'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        lfs: true
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: uv.lock
    - name: Restore the uv download cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/uv
        key: uv-v1-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ hashFiles('uv.lock', 'pyproject.toml') }}
    - name: Install uv and locked Python dependencies
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install uv==0.13.6
        uv sync --python "$(command -v python3)" --frozen --extra test
    - name: Run Python tests
      shell: bash
      run: uv run --frozen --extra test python -m pytest
  landing:
    name: Landing image check
    if: github.repository == 'subculture-collective/subsets'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REVISION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        lfs: true
        persist-credentials: false
    - name: Build and check the landing image
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$REVISION"
        image="subsets-landing-main:$REVISION"
        docker build -f deploy/Dockerfile -t "$image" \
          --label "tv.subcult.source-revision=$REVISION" \
          --label "tv.subcult.deployment.channel=main" \
          --label "org.opencontainers.image.revision=$REVISION" \
          --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/subsets" .
        bash deploy/check-landing-image.sh "$image"
  mirror-gate:
    name: Mirror CI gate
    if: always() && github.repository == 'subculture-collective/subsets'
    needs:
    - node
    - python
    - landing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every verification job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ["RESULTS"])
        expected = {'node', 'python', 'landing'}
        assert set(results) == expected, results
        for name, result in results.items():
            assert result["result"] == "success", name + " did not pass"
        PY
