name: CI
# Pull requests are verified by .github/workflows/mirror-ci.yml on the GitHub
# mirror, reported back here as "GitHub CI / Mirror CI gate". This workflow
# verifies main after merge; GitHub deploys it (.github/workflows/deploy.yml).
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer main push waits instead of cancelling.
  cancel-in-progress: false

jobs:
  node:
    name: Node quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      # LFS objects are pulled in the next step. During checkout the action sends the
      # job token as an extra header, git-lfs adds the batch reply's Authorization
      # header, and Cloudflare answers the doubled header with 400.
      with:
        persist-credentials: false
    - name: Fetch LFS objects
      # Anonymous, so each download carries one Authorization header. Public repository.
      shell: bash
      run: git lfs install --local && git lfs pull
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install locked Node dependencies
      shell: bash
      run: npm ci
    - name: Run Node checks
      shell: bash
      run: |-
        npm test
        npm run typecheck
        npm run format:check
  python:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      # LFS objects are pulled in the next step. During checkout the action sends the
      # job token as an extra header, git-lfs adds the batch reply's Authorization
      # header, and Cloudflare answers the doubled header with 400.
      with:
        persist-credentials: false
    - name: Fetch LFS objects
      # Anonymous, so each download carries one Authorization header. Public repository.
      shell: bash
      run: git lfs install --local && git lfs pull
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
      env:
        AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/python-tools-${{ github.run_id }}-${{ github.run_attempt }}-${{
          github.job }}
        RUNNER_TOOL_CACHE: ${{ runner.temp }}/python-tools-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job
          }}
    - name: Install uv and locked Python dependencies
      shell: bash
      run: |-
        python3 -m pip install uv==0.13.6
        uv sync --python "$(command -v python3)" --frozen --extra test
    - name: Run Python tests
      shell: bash
      run: uv run --frozen --extra test python -m pytest
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
    - node
    - python
    steps:
    - name: Require every quality job to succeed
      shell: bash
      run: |-
        test "$NODE_RESULT" = success
        test "$PYTHON_RESULT" = success
      env:
        NODE_RESULT: ${{ needs.node.result }}
        PYTHON_RESULT: ${{ needs.python.result }}
